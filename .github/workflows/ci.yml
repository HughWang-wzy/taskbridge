name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Test Go client
        run: go test ./...
      - name: Install Worker dependencies
        run: npm ci
      - name: Prepare local Worker binding
        run: cp wrangler.example.jsonc wrangler.jsonc
      - name: Test Worker
        run: npm test
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Test Cloudflare setup wizard
        run: node --test test/setup_smoke.mjs
      - name: Test Linux Node.js repair
        run: python3 test/first_run_node_smoke.py
      - name: Test release checkout update
        run: python3 test/first_run_update_smoke.py
      - name: Build release archives
        run: npm run package
      - name: Test Linux installer
        run: python3 test/installer_smoke.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: taskbridge-release-archives
          path: release/

  validate-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Test Windows client
        run: go test ./...
      - name: Test Cloudflare setup wizard
        run: node --test test/setup_smoke.mjs
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/install.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Parse PowerShell first-run wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/first-run.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  test-macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build archives
        run: bash scripts/package.sh
      - name: Test macOS installer
        run: python3 test/installer_smoke.py
